<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Meridian sign-in</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; color: #222; background: #fff; }
  code { background: #f2f2f2; padding: 0 .3em; border-radius: 3px; }
</style>
</head>
<body>
<h1>Finishing TikTok sign-in…</h1>
<p id="msg">Sending you back to Meridian on this computer.</p>
<script>
  // TikTok only accepts https sign-in addresses, so it returns here; this page hands the sign-in code
  // straight to the Meridian helper running on the same computer. Nothing is stored or sent anywhere else.
  var q = location.search;
  if (q && /[?&]state=/.test(q)) {
    location.replace('http://127.0.0.1:4777/oauth/tiktok/callback' + q);
  } else {
    document.getElementById('msg').textContent = 'There is no sign-in to finish here. Start the TikTok sign-in from Meridian.';
  }
</script>
<noscript><p>Turn on JavaScript to finish signing in.</p></noscript>
</body>
</html>
